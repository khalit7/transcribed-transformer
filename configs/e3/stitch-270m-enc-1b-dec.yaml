# E3-mix-and-match, arm B: the T5Gemma 2 270m-270m encoder (640 wide) with the T5Gemma 2 1b-1b decoder (1152 wide),
# joined by an affine stitch on the encoder states fitted by ridge regression onto the 1b encoder's states
# (checkpoints/stitch/270m-to-1b.pt, src/train/fit_stitch.py), so the decoder reads a familiar input at step 0.
# Everything trains under E1's recipe as the balanced pairs did (16k cap, DDP, SDPA); the stitch at 10× the base rate.
# Grid: 270m-270m and 1b-1b exist; arm A is the mirror (configs/e3/stitch-1b-enc-270m-dec.yaml).
experiment: e3
name: e3-stitch-270m-enc-1b-dec
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
model:
  base: google/t5gemma-2-1b-1b           # the decoder donor
  encoder_base: google/t5gemma-2-270m-270m   # the encoder donor
  stitch: checkpoints/stitch/270m-to-1b.pt
  arch: stitched
  attn: sdpa
  gradient_checkpointing: true
optim:
  lr: 1.0e-5
  lr_mult: {stitch: 10}
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 1
batch_sequences: 32
micro_tokens: 16384
val_every: 200
checkpoint_minutes: 30
keep_checkpoints: 1
wandb_project: tt-encdec
tags: [mix-and-match, stitched, enc-google/t5gemma-2-270m-270m, dec-google/t5gemma-2-1b-1b, full-params, grid-270m-enc-1b-dec]
