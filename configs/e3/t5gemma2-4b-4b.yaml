# E3, native reference at the top of the family: T5Gemma 2 4b-4b (adapted from Gemma 3 4B), E1's recipe under the
# sharded bf16 + stochastic-rounding recipe (7.5B parameters; fp32 masters would need 37 GB per GPU). Its pair is
# configs/e1/gemma3-4b-pt.yaml under the same recipe. 16k cap.
experiment: e3
name: e3-t5gemma2-4b-4b
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
model:
  base: google/t5gemma-2-4b-4b
  arch: hf_encdec
  sharding: fsdp
  attn: sdpa
  gradient_checkpointing: true
optim:
  lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
  weights: bf16_sr
epochs: 1
batch_sequences: 32
micro_tokens: 8192
val_every: 200
checkpoint_minutes: 30
wandb_project: tt-encdec
tags: [native, google/t5gemma-2-4b-4b, full-params, bf16-sr, pair-gemma3-4b]
