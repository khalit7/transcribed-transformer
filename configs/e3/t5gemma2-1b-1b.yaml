# E3, native reference: T5Gemma 2 1b-1b, Google's encoder-decoder adapted from Gemma 3 1B with about 2T tokens,
# fine-tuned with E1's recipe (same data, split, steps, schedule). Not comparable with the Qwen arms (different
# origin, tokenizer, size); its pair is configs/e1/gemma3-1b-pt.yaml, the decoder it was adapted from, fine-tuned
# identically. Context capped at the model's native 16k (the benchmark's longest case is 15k tokens).
experiment: e3
name: e3-t5gemma2-1b-1b
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
model:
  base: google/t5gemma-2-1b-1b
  arch: hf_encdec
  attn: sdpa               # transformers has no flash-attention path for T5Gemma 2
  gradient_checkpointing: true
optim:
  lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 1
batch_sequences: 32
micro_tokens: 16384
val_every: 200
checkpoint_minutes: 30
wandb_project: tt-encdec
tags: [native, google/t5gemma-2-1b-1b, full-params, pair-gemma3-1b]
