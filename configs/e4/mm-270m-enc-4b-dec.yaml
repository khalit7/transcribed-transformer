# E4-mix-and-match idea 2, arm D: the T5Gemma 2 270m-270m encoder (640 wide) with the T5Gemma 2 4b-4b decoder (2560 wide),
# joined by an affine stitch on the encoder states fitted by ridge regression onto the 4b encoder's states
# (checkpoints/stitch/270m-to-4b.pt, src/train/fit_stitch.py), so the decoder reads a familiar input at step 0.
# Everything trains under E1's recipe (16k cap, SDPA); ~4.2B parameters need FSDP (as the Gemma 3 4B control did) and 8k micro-batches.
# Grid extension: the 1B arms exist; arm C is the mirror (configs/e4/mm-4b-enc-270m-dec.yaml).
experiment: e4
name: e3-stitch-270m-enc-4b-dec
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
model:
  base: google/t5gemma-2-4b-4b           # the decoder donor
  encoder_base: google/t5gemma-2-270m-270m   # the encoder donor
  stitch: checkpoints/stitch/270m-to-4b.pt
  arch: stitched
  attn: sdpa
  sharding: fsdp
  gradient_checkpointing: true
optim:
  lr: 1.0e-5
  lr_mult: {stitch: 10}
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 1
batch_sequences: 32
micro_tokens: 8192
val_every: 200
checkpoint_minutes: 30
keep_checkpoints: 1
wandb_project: tt-encdec
tags: [mix-and-match, stitched, enc-google/t5gemma-2-270m-270m, dec-google/t5gemma-2-4b-4b, full-params, grid-270m-enc-4b-dec]
