# e4mm-1b-enc-270m-dec-v2: an arm of the labelled-data-v2 grid, stage 1 of 3. Generated by scripts/make_v2_configs.py
# from configs/e4/mm-1b-enc-270m-dec.yaml (recipe and model block, see below); differs from it in the data (v2 split, 20
# questions per episode, seed 0), epochs (1) and val_every (575: 2875 steps per epoch).
# Recipe unchanged; model block unchanged but its stitch, the v2 refit checkpoints/stitch/1b-to-270m-v2.pt.
experiment: e4
name: e4mm-1b-enc-270m-dec-v2
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
  train: data/labelled_data_v2/train.jsonl
  val: data/labelled_data_v2/val.jsonl
  overlong: drop
  questions_per_episode: 20
  question_seed: 0
model: {base: google/t5gemma-2-270m-270m, encoder_base: google/t5gemma-2-1b-1b, stitch: checkpoints/stitch/1b-to-270m-v2.pt,
  arch: stitched, attn: sdpa, gradient_checkpointing: true}
optim:
  lr: 1.0e-05
  lr_mult: {stitch: 10}
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 1
batch_sequences: 32
micro_tokens: 16384
val_every: 575
checkpoint_minutes: 30
keep_checkpoints: 1
wandb_project: tt-encdec
tags: [dec-google/t5gemma-2-270m-270m, enc-google/t5gemma-2-1b-1b, full-params, labelled-v2, mix-and-match, stitched, v2-q20,
  v2-questions-fb74c376, v2-stage-1]
