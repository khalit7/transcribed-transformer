# NOT RUNNABLE ON THE LOCAL PAIR OF 32 GB CARDS UNDER E1'S RECIPE: the 4b encoder + 1B decoder is about 4.9B parameters and full-parameter training with
# fp32 masters ran out of memory on the longest records at 8k and at 4k micro-batches (measured 2026-09-28, queue 28); only a frozen-embedding
# variant fits, which the recipe does not allow. Meant for rented hardware (one 80 GB card, DDP, or two under FSDP).
# E5++ with the 4b encoder: the E5 fine-tune of the T5Gemma 2 4b encoder into Gemma 3 1B, started from the corpora-scale
# continuation-adapted checkpoint (configs/adapt/continuation-corpora-e5-t5gemma2-4b-enc-gemma3-1b.yaml). Read against E1++ on the 1B
# decoder (e1pp-gemma3-1b-pt, 0.650 / 0.470) beside the 270m and 1b adapted arms: does the recipe scale with the encoder? Also the
# fast configuration (a 3.9B encoder once per prompt, a 1B decoder per token) against the Gemma 3 4B decoder (0.778 / 0.702).
# ~4.9B parameters, FSDP, 8k micro-batches.
experiment: e5
name: e5pp-t5gemma2-4b-enc-gemma3-1b
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
model:
  base: checkpoints/adapt-continuation-corpora-e5-t5gemma2-4b-enc-gemma3-1b/final   # a SoftStitched.save dir: encoder, stitch and decoder
  arch: soft
  decoder_sees_prompt: true
  sharding: fsdp
  attn: flash_attention_2
  gradient_checkpointing: true
optim:
  lr: 1.0e-5
  lr_mult: {stitch: 10}
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 1
batch_sequences: 32
micro_tokens: 8192
val_every: 200
checkpoint_minutes: 30
keep_checkpoints: 1
wandb_project: tt-encdec
tags: [soft-tokens, adapted, google/gemma-3-1b-pt, enc-google/t5gemma-2-4b-4b, full-params, corpora, control-e1pp-gemma3-1b-pt]
