# e1pp-gemma3-1b-pt-ecthr: one of the sixteen arms of the ecthr transfer grid (nine E1/E4, seven E1++/E5-soft-tokens++). Generated by scripts/make_transfer_configs.py from configs/e1/gemma3-1b-pt-plusplus.yaml (recipe and model block
# unchanged); differs from it in the data paths, the over-long policy (truncate, data.fit_prompt), epochs and
# val_every (450: 2250 steps per epoch).
experiment: e1
name: e1pp-gemma3-1b-pt-ecthr
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
  train: data/labelled_data/ecthr/train.jsonl
  val: data/labelled_data/ecthr/val.jsonl
  overlong: truncate
model: {base: checkpoints/adapt-continuation-corpora-gemma3-1b-pt/final, attn: flash_attention_2, gradient_checkpointing: true}
optim: {lr: 1.0e-05, warmup_steps: 50, weight_decay: 0.1, optimizer: adamw8bit}
epochs: 2
batch_sequences: 32
micro_tokens: 32768
val_every: 450
checkpoint_minutes: 30
keep_checkpoints: 1
wandb_project: tt-decoder
tags: [adapted, corpora, full-params, google/gemma-3-1b-pt, transfer-ecthr, transfer-grid]
