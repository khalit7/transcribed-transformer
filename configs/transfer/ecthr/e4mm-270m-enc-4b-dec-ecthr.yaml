# e4mm-270m-enc-4b-dec-ecthr: one of the sixteen arms of the ecthr transfer grid (nine E1/E4, seven E1++/E5-soft-tokens++). Generated by scripts/make_transfer_configs.py from configs/e4/mm-270m-enc-4b-dec.yaml (recipe and model block
# unchanged); differs from it in the data paths, the over-long policy (truncate, data.fit_prompt), epochs and
# val_every (450: 2250 steps per epoch).
experiment: e4
name: e4mm-270m-enc-4b-dec-ecthr
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
  train: data/labelled_data/ecthr/train.jsonl
  val: data/labelled_data/ecthr/val.jsonl
  overlong: truncate
model: {base: google/t5gemma-2-4b-4b, encoder_base: google/t5gemma-2-270m-270m, stitch: checkpoints/stitch/270m-to-4b.pt,
  arch: stitched, attn: sdpa, sharding: fsdp, gradient_checkpointing: true}
optim:
  lr: 1.0e-05
  lr_mult: {stitch: 10}
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 2
batch_sequences: 32
micro_tokens: 8192
val_every: 450
checkpoint_minutes: 30
keep_checkpoints: 1
wandb_project: tt-encdec
tags: [dec-google/t5gemma-2-4b-4b, enc-google/t5gemma-2-270m-270m, full-params, mix-and-match, stitched, transfer-ecthr, transfer-grid]
