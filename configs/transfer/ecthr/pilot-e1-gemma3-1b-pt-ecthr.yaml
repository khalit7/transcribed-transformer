# pilot-e1-gemma3-1b-pt-ecthr: the epoch pilot for ecthr: trains 2 epochs at a constant learning rate after warm-up, the val-loss curve picks the count every arm then uses. Generated by scripts/make_transfer_configs.py from configs/e1/gemma3-1b-pt.yaml (recipe and model block
# unchanged); differs from it in the data paths, the over-long policy (truncate, data.fit_prompt), epochs and
# val_every (450: 2250 steps per epoch).
experiment: e1
name: pilot-e1-gemma3-1b-pt-ecthr
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
  train: data/labelled_data/ecthr/train.jsonl
  val: data/labelled_data/ecthr/val.jsonl
  overlong: truncate
model: {base: google/gemma-3-1b-pt, attn: flash_attention_2, gradient_checkpointing: true}
optim: {lr: 1.0e-05, warmup_steps: 50, weight_decay: 0.1, optimizer: adamw8bit, min_lr_ratio: 1.0}
epochs: 2
batch_sequences: 32
micro_tokens: 32768
val_every: 450
checkpoint_minutes: 30
wandb_project: tt-decoder
tags: [full-params, google/gemma-3-1b-pt, pilot, transfer-ecthr, transfer-grid]
