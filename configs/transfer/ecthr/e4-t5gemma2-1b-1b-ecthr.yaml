# e4-t5gemma2-1b-1b-ecthr: one of the sixteen arms of the ecthr transfer grid (nine E1/E4, seven E1++/E5++). Generated by scripts/make_transfer_configs.py from configs/e4/t5gemma2-1b-1b.yaml (recipe and model block
# unchanged); differs from it in the data paths, the over-long policy (truncate, data.fit_prompt), epochs and
# val_every (450: 2250 steps per epoch).
experiment: e4
name: e4-t5gemma2-1b-1b-ecthr
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
  train: data/labelled_data/ecthr/train.jsonl
  val: data/labelled_data/ecthr/val.jsonl
  overlong: truncate
model: {base: google/t5gemma-2-1b-1b, arch: hf_encdec, attn: sdpa, gradient_checkpointing: true}
optim: {lr: 1.0e-05, warmup_steps: 50, weight_decay: 0.1, optimizer: adamw8bit}
epochs: 2
batch_sequences: 32
micro_tokens: 16384
val_every: 450
checkpoint_minutes: 30
wandb_project: tt-encdec
tags: [full-params, google/t5gemma-2-1b-1b, native, transfer-ecthr, transfer-grid]
