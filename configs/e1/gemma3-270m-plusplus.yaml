# E1++ on Gemma 3 270M: the E1 fine-tune (configs/e1/gemma3-270m.yaml, 0.446 / 0.315) started from the corpora-scale
# continuation-adapted checkpoint (configs/adapt/continuation-corpora-gemma3-270m.yaml). The matched control of the three E5++ arms
# into the 270M decoder (D56): same adaptation data, cuts and budget, the prefix read as tokens.
experiment: e1
name: e1pp-gemma3-270m
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
model:
  base: checkpoints/adapt-continuation-corpora-gemma3-270m/final
  attn: flash_attention_2
  gradient_checkpointing: true
optim:
  lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 1
batch_sequences: 32
micro_tokens: 32768
val_every: 200
checkpoint_minutes: 30
keep_checkpoints: 1
wandb_project: tt-decoder
tags: [adapted, corpora, google/gemma-3-270m, full-params, control-e5pp-270m]
