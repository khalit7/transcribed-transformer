# E1+ on Gemma 3 1B: the E1 fine-tune (configs/e1/gemma3-1b-pt.yaml) started from the continuation-adapted checkpoint
# (configs/adapt/continuation-gemma3-1b-pt.yaml). The matched control of E5+ (configs/e5/t5gemma2-1b-enc-gemma3-1b-plus.yaml):
# same adaptation data, cuts and budget, the prefix read as tokens.
experiment: e1
name: e1plus-gemma3-1b-pt
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
model:
  base: checkpoints/adapt-continuation-gemma3-1b-pt/final
  attn: flash_attention_2
  gradient_checkpointing: true
optim:
  lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 1
batch_sequences: 32
micro_tokens: 32768
val_every: 200
checkpoint_minutes: 30
keep_checkpoints: 1
wandb_project: tt-decoder
tags: [adapted, google/gemma-3-1b-pt, full-params, control-e5plus]
