# E1, control: causal SFT, loss on the answer only, every training record (all four corpora).
experiment: e1
name: e1-qwen3-1.7b-base
seed: 0
data:
  variants: [labelled]     # the variant each label was made on (clean for the service-call corpora, real ASR for SPoRC)
  max_seq_len: 32768
model:
  base: Qwen/Qwen3-1.7B-Base
  attn: flash_attention_2
  gradient_checkpointing: true
optim:
  lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 1
batch_sequences: 32
micro_tokens: 32768
val_every: 200
checkpoint_minutes: 30
wandb_project: tt-decoder
