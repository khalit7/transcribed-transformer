# E1 on Gemma 3 1B (pretrained), the decoder T5Gemma 2 1b-1b was adapted from: the control for
# configs/e4/t5gemma2-1b-1b.yaml. E1's recipe unchanged; context capped at 16k to match its pair.
experiment: e1
name: e1-gemma3-1b-pt
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
model:
  base: google/gemma-3-1b-pt
  attn: flash_attention_2
  gradient_checkpointing: true
optim:
  lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 1
batch_sequences: 32
micro_tokens: 32768
val_every: 200
checkpoint_minutes: 30
wandb_project: tt-decoder
tags: [google/gemma-3-1b-pt, full-params, pair-t5gemma2-1b-1b]
