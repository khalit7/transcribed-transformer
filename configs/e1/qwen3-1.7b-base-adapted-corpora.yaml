# E1++ (only if E2++ is promising): the E1 fine-tune from the checkpoint adapted causally on the same outside text.
experiment: e1
name: e1pp-qwen3-1.7b-base
seed: 0
data:
  variants: [labelled]     # the variant each label was made on (clean for the service-call corpora, real ASR for SPoRC)
  max_seq_len: 32768
model:
  base: checkpoints/adapt-causal-corpora-qwen3-1.7b-base/final
  attn: flash_attention_2
  gradient_checkpointing: true
optim:
  lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 1
batch_sequences: 32
micro_tokens: 32768
val_every: 200
checkpoint_minutes: 30
wandb_project: tt-decoder
tags: [adapted, corpora, Qwen/Qwen3-1.7B-Base]
