# E1 recipe on Qwen2.5-1.5B (base): a parameter-matched decoder control for the native T5Gemma 2 1b-1b
# (1.31B non-embedding parameters against the 1b-1b's 1.40B; same vendor as E1's Qwen3-1.7B-Base, previous
# generation). E1's recipe unchanged; 16k cap as in the Gemma pairs. Surveyed 2026-09-20 (notes §6).
experiment: e1
name: e1-qwen2.5-1.5b
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
model:
  base: Qwen/Qwen2.5-1.5B
  attn: flash_attention_2
  gradient_checkpointing: true
optim:
  lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 1
batch_sequences: 32
micro_tokens: 32768
val_every: 200
checkpoint_minutes: 30
wandb_project: tt-decoder
tags: [Qwen/Qwen2.5-1.5B, 1.5B, full-params, matched-control-t5gemma2-1b-1b]
