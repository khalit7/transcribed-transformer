# Cross-family E1 baseline for the native T5Gemma 2 1b-1b comparison, not an architecture-only ablation.
# Same target-only SFT and fp32-master recipe; 16k cap as in the native Gemma pair.
experiment: e1
name: e1-smollm3-3b-base
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
model:
  base: HuggingFaceTB/SmolLM3-3B-Base
  sharding: fsdp           # unsharded fp32-master probe OOM on the first optimiser update
  attn: flash_attention_2
  gradient_checkpointing: true
optim:
  lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
  weights: fp32_master
epochs: 1
batch_sequences: 32
micro_tokens: 16384
val_every: 200
checkpoint_minutes: 30
wandb_project: tt-decoder
tags: [3B, full-params, cross-family, comparison-t5gemma2-1b-1b]
