# Adaptation stage for E1++ (only if E2++ is promising): causal next-token prediction on the same outside text
# as configs/adapt/mntp-corpora-qwen3-1.7b-base.yaml, so the pair stays matched.
experiment: e1
name: adapt-causal-corpora-qwen3-1.7b-base
seed: 0
data:
  variants: [labelled]
  max_seq_len: 32768
model:
  base: Qwen/Qwen3-1.7B-Base
  attn: flash_attention_2
  gradient_checkpointing: true
adapt:
  objective: causal
  corpora:
    - {path: data/interim/callcenteren/train.jsonl, docs: 88933, val_docs: 100}   # all of it: real call-centre ASR, undiarised
    - {path: data/interim/sporc/train.jsonl, docs: 35000, val_docs: 40}           # diarised podcasts, long; labelled episodes excluded
    - {path: data/interim/meetingbank/train.jsonl, docs: 1218, val_docs: 10}      # all: council meetings, long, truncated at 32k
    - {path: data/interim/courtlistener/train.jsonl, docs: 6400, val_docs: 10}    # all: oral arguments
optim:
  lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 1
batch_sequences: 32
micro_tokens: 16384
val_every: 500
checkpoint_minutes: 30
wandb_project: tt-pretrain
tags: [adapt, corpora]
