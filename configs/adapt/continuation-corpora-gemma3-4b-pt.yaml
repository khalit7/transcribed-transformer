# Adaptation stage for E1++ on Gemma 3 4B (pretrained, multimodal checkpoint; the image tower is frozen and never called), the matched
# control of E5++ on the 4B decoder: the continuation objective (a document cut in its middle half, the prefix read as tokens, up to
# 2,048 tokens of the continuation predicted, loss on the continuation only) on the outside-text sample of the ++ stages (~131k
# documents, one epoch, ~4.1k steps), identical to configs/adapt/continuation-corpora-gemma3-1b-pt.yaml but for the decoder. E1's
# recipe (fp32 masters, sharded), 16k cap, 8k micro-batches.
experiment: e1
name: adapt-continuation-corpora-gemma3-4b-pt
seed: 0
data:
  variants: [labelled]
  max_seq_len: 16384
model:
  base: google/gemma-3-4b-pt
  sharding: fsdp
  attn: flash_attention_2
  gradient_checkpointing: true
adapt:
  objective: seq2seq
  max_target: 2048
  cut: [0.25, 0.75]
  corpora:   # the E1++/E2++ outside-text sample; labelled calls excluded
    - {path: data/interim/callcenteren/train.jsonl, docs: 88933, val_docs: 100}
    - {path: data/interim/sporc/train.jsonl, docs: 35000, val_docs: 40}
    - {path: data/interim/meetingbank/train.jsonl, docs: 1218, val_docs: 10}
    - {path: data/interim/courtlistener/train.jsonl, docs: 6400, val_docs: 10}
optim:
  lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  optimizer: adamw8bit
epochs: 1
batch_sequences: 32
micro_tokens: 8192
val_every: 500
checkpoint_minutes: 30
keep_checkpoints: 1
wandb_project: tt-pretrain
tags: [adapt, continuation, corpora, google/gemma-3-4b-pt, control-e5pp-4b]
